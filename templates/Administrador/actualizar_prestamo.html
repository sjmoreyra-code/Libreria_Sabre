{% extends "Administrador/base.html" %}
{% load static %}

{% block title %}
    Editar Préstamo - BIBLIOTECA SaBré
{% endblock title %}

{% block codigoDinamico %}
<main class="main-content">
    <section class="products-section">
        <div class="products-header">
            <h1 class="section-title uppercase tracking-wider">
                Editar Préstamo #{{ prestamo.id }}
            </h1>
        </div>

        <div class="table-container">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}

                <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                    <button type="submit" class="btn-nuevo-libro">
                        Guardar Cambios
                    </button>
                    <a href="{% url 'prestamos' %}" class="btn-buscar-libros">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </section>
</main>
{% endblock codigoDinamico %}
